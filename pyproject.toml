[project]
name = "eot"
version = "0.2.0"
description = "End-of-turn detector for voice agents: pause-level training, causal policy, EoT Bench adapter, ONNX serving."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "torch>=2.3",
    "transformers>=4.44",
    "soundfile>=0.12",
    "onnxruntime>=1.18",
    "onnx>=1.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
data = [
    "datasets>=3.0",
    "pyarrow>=16",
    "scipy>=1.11",
]
dev = [
    "pytest>=8",
]
tracking = [
    "wandb>=0.29.0",
]

[project.scripts]
eot-acquire = "eot.data.smart_turn:main"
eot-mine = "eot.labeling.prefix_mining:main"
eot-apptek = "eot.labeling.apptek:main"
eot-qa = "eot.labeling.qa:main"
eot-krisp = "eot.eval.krisp:main"
eot-train = "eot.modeling.train:main"
eot-soup = "eot.modeling.soup:main"
eot-export = "eot.modeling.export_onnx:main"
eot-sweep = "eot.eval.policy:main"
eot-report = "eot.eval.report:main"
eot-challenge = "eot.eval.challenge:main"
eot-serve = "eot.serving.service:main"
eot-loadtest = "eot.serving.load_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eot"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
