name: eot-delivery
services:
  whisper-cpu:
    image: happyrobot-eot:whisper-cpu-delivery
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["127.0.0.1:8891:8000"]
    environment:
      EOT_ONNX: /models/eot.onnx
      EOT_THREADS: "8"
    volumes: ["${EOT_MODEL_ROOT:-./artifacts/deployment}/whisper-cpu:/models:ro"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  cohere-gpu:
    image: happyrobot-eot:cohere-gpu-delivery
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus: all
    ports: ["127.0.0.1:8892:8000"]
    environment:
      EOT_TRT_ENGINE: /models/eot.plan
      EOT_THREADS: "2"
    volumes: ["${EOT_MODEL_ROOT:-./artifacts/deployment}/cohere-gpu:/models:ro"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
