name: CPU contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the locked CPU environment
        run: |
          python -m pip install uv==0.10.4
          uv venv .venv-ci --python 3.13
          uv pip sync --python .venv-ci/bin/python --require-hashes requirements/test-cpu.lock
          uv pip install --python .venv-ci/bin/python --no-deps -e .
      - name: Package tests
        run: .venv-ci/bin/python -m pytest -q tests
      - name: Lint
        run: |
          uv tool run ruff@0.16.6 check src tests scripts
